name: Release FileMaster Plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Verify committed bundle
        run: git diff --exit-code -- main.js

      - name: Package plugin
        run: npm run package

      - name: Prepare release notes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          if (process.env.GITHUB_REF_NAME !== require('./manifest.json').version) {
            throw new Error('Release tag must match manifest.json version');
          }
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const marker = `## [${process.env.GITHUB_REF_NAME}]`;
          const start = changelog.indexOf(marker);
          if (start < 0) throw new Error(`Missing changelog entry: ${marker}`);
          const end = changelog.indexOf('\n## [', start + marker.length);
          const notes = changelog.slice(start, end < 0 ? undefined : end).trim();
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'file-master-release-notes.md'), notes + '\n');
          NODE

      - name: Generate Artifact Attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: ${{ runner.temp }}/file-master-release-notes.md
          make_latest: true
          files: |
            main.js
            manifest.json
            styles.css
